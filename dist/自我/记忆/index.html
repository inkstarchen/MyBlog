      <div id="article-body"><h1>记忆</h1>
<p>记忆并非档案。每一次回想，都在重新安排过去与现在的距离。</p></div>

  <script type="application/json" id="space-data">{"site":{"title":"认知空间","description":"一个让沉淀内容随着注意力逐层显现的个人认知空间。","language":"zh-CN","base_path":"/MyBlog/","content_dir":"content","output_dir":"dist","max_visible_nodes":18},"nodes":{"":{"id":"dc76e9f0c0","slug":"root","path":"","title":"认知空间","description":"从一个长久的主题出发，让内容随着注意力逐层显现。","order":0,"body":"\u003ch1>从一个主题开始\u003c/h1>\n\u003cp>这里不收纳所有笔记，也不追求一次把所有内容摆在眼前。\u003c/p>\n\u003cp>它只保存那些已经沉淀下来、值得反复回到其中的主题。选择外围的一个方向，内容会随着你的注意力逐层显现；中心保存此刻所在位置的完整文字。\u003c/p>","parent":null,"children":["自我/","关系/","世界/","创造/"]},"世界/":{"id":"93425f2976","slug":"世界","path":"世界/","title":"世界","description":"那些在日常生活中不断重遇、值得长久凝视的事物。","order":30,"body":"\u003ch1>世界\u003c/h1>\n\u003cp>这里存放关于自然、地方和日常经验的长期主题。\u003c/p>\n\u003cp>它们并不要求及时更新，只在新的经验真正改变了理解时，才需要被重新书写。\u003c/p>","parent":"","children":["世界/日常/","世界/自然/"]},"世界/日常/":{"id":"57ba06bcdf","slug":"日常","path":"世界/日常/","title":"日常","description":"重复发生，却总能显露不同细节的生活部分。","order":10,"body":"\u003ch1>日常\u003c/h1>\n\u003cp>日常不是宏大事件之间的空隙。它本身就是生活发生的主要地方。\u003c/p>","parent":"世界/","children":[]},"世界/自然/":{"id":"157f6ecb52","slug":"自然","path":"世界/自然/","title":"自然","description":"季节、生命与不以人的意志为中心的秩序。","order":20,"body":"\u003ch1>自然\u003c/h1>\n\u003cp>自然提醒我们，世界中始终存在着比个人时间更缓慢、也更广阔的尺度。\u003c/p>","parent":"世界/","children":[]},"关系/":{"id":"894ed3dbf7","slug":"关系","path":"关系/","title":"关系","description":"我们如何靠近、理解彼此，也如何保留各自完整的空间。","order":20,"body":"\u003ch1>关系\u003c/h1>\n\u003cp>关系不是静止的定义，而是在靠近与分离、表达与倾听之间不断形成的经验。\u003c/p>\n\u003cp>这里沉淀那些值得反复回看的相处方式，以及人与人之间长久存在的问题。\u003c/p>","parent":"","children":["关系/边界/","关系/理解/"]},"关系/理解/":{"id":"9cd913fdd4","slug":"理解","path":"关系/理解/","title":"理解","description":"在判断之前，为另一种经验保留位置。","order":20,"body":"\u003ch1>理解\u003c/h1>\n\u003cp>理解并不要求完全认同。它首先意味着承认：同一件事可以从不同的生命经验中呈现出不同的样子。\u003c/p>\n\u003ch2>在判断之前\u003c/h2>\n\u003cp>我们很容易把自己的经验当成默认尺度。当另一个人的反应与预期不同时，判断往往比理解更快发生。理解需要在这个瞬间留出一点空白：暂时不急着解释，也不急着把对方放进一个熟悉的分类里。\u003c/p>\n\u003cp>这并不是放弃判断，而是让判断来得更晚一些。先看见一个人正在经历什么，再决定自己如何回应。\u003c/p>\n\u003ch2>理解的边界\u003c/h2>\n\u003cp>理解不等于认同，也不意味着必须接受所有行为。我们可以理解一种感受从何而来，同时仍然不同意由它产生的选择；也可以看见一个人的难处，同时保留自己的边界。\u003c/p>\n\u003cp>真正的理解不会消除差异。它只是让差异不必立刻变成敌意。\u003c/p>\n\u003ch2>回到倾听\u003c/h2>\n\u003cp>倾听时，最困难的部分常常不是保持安静，而是不在心里提前准备答案。很多时候，对方需要的并不是一个解决办法，而是确认自己的经验确实被另一个人接住了。\u003c/p>\n\u003cp>可以反复问自己：我现在听见的是对方真正表达的内容，还是我根据过去经验迅速完成的解释？这个问题不会让理解变得完美，却能让我们一次次回到更开放的位置。\u003c/p>\n\u003cp>理解最终是一种持续练习。它很少在一次谈话中完成，而是在许多次愿意重新看见彼此的时刻里慢慢形成。\u003c/p>","parent":"关系/","children":[]},"关系/边界/":{"id":"b06bd8df4c","slug":"边界","path":"关系/边界/","title":"边界","description":"亲近并不意味着消失，距离也不必等同于疏离。","order":10,"body":"\u003ch1>边界\u003c/h1>\n\u003cp>清晰的边界不是把人隔开，而是让彼此能够在关系中保持真实。\u003c/p>","parent":"关系/","children":[]},"创造/":{"id":"8b2d308af1","slug":"创造","path":"创造/","title":"创造","description":"写作、设计以及尚未被命名的可能性。","order":40,"body":"\u003ch1>创造\u003c/h1>\n\u003cp>创造不是从虚无中产生事物，而是发现原本相距遥远的事物之间存在联系。\u003c/p>","parent":"","children":[]},"自我/":{"id":"c22df6ee4e","slug":"自我","path":"自我/","title":"自我","description":"关于感受、记忆以及我如何理解自身。","order":10,"body":"\u003ch1>自我\u003c/h1>\n\u003cp>自我是观察者，也是持续被观察和重写的对象。\u003c/p>\n\u003cp>这一部分用于存放关于记忆、感知和个人经验的内容。\u003c/p>","parent":"","children":["自我/记忆/","自我/感知/"]},"自我/感知/":{"id":"8cffd13121","slug":"感知","path":"自我/感知/","title":"感知","description":"身体、环境与意识相遇的位置。","order":20,"body":"\u003ch1>感知\u003c/h1>\n\u003cp>我们并不只是接收世界，也在持续参与世界的形成。\u003c/p>","parent":"自我/","children":[]},"自我/记忆/":{"id":"cb3abd4732","slug":"记忆","path":"自我/记忆/","title":"记忆","description":"那些留下来、发生变化，又重新塑造现在的片段。","order":10,"body":"\u003ch1>记忆\u003c/h1>\n\u003cp>记忆并非档案。每一次回想，都在重新安排过去与现在的距离。\u003c/p>","parent":"自我/","children":[]}}}</script>
